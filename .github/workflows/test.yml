name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          npm ci

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy layers/shared/python/shared functions || true  # advisory until annotated throughout

      # No AWS credentials in this job. Every test runs against moto; a test
      # that reaches a real endpoint fails here rather than in production.
      - name: Tests and coverage gate
        run: pytest

      - name: Synthesize infrastructure
        run: npx cdk synth --quiet
        env:
          CDK_DEFAULT_ACCOUNT: "000000000000"
          CDK_DEFAULT_REGION: ca-central-1
