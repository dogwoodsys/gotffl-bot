[project]
name = "gotffl-bot"
version = "0.1.0"
description = "Posts fantasy football league activity from Yahoo Fantasy Sports to X"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "requests>=2.32",
    "requests-oauthlib>=2.0",
]

[project.optional-dependencies]
dev = [
    "aws-cdk-lib>=2.150",
    "constructs>=10.3",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[dynamodb,ssm,sqs,sns]>=5.0",
    "responses>=0.25",
    "freezegun>=1.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "boto3-stubs[dynamodb,ssm,sqs,sns]",
    "types-requests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --cov-fail-under=90"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["layers/shared/python/shared", "functions"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# N818 wants an "Error" suffix on every exception. RateLimited/SegmentTooLong
# read better at the call site and are raised, not returned.
# UP042 prefers enum.StrEnum, but these values are serialised into SQS bodies
# where `str` inheritance keeps json.dumps working without a custom encoder.
ignore = ["N818", "UP042"]

[tool.ruff.lint.per-file-ignores]
# The fullwidth colon is the point of the test.
"tests/test_text.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
